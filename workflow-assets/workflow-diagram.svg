    <path d="M605 736 C755 737 875 740 960 787" marker-end="url(#arrow)"/>
    <path d="M1000 839 C965 880 900 912 812 930" marker-end="url(#arrow)"/>
    <path d="M1060 839 C1070 885 1040 920 982 930" marker-end="url(#arrow)"/>
