<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
  <title id="title">Roamwise user workflow</title>
  <desc id="desc">Traveler inputs lead to recommendations, data visualization, daily price comparison, and date or price refinements.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#007a32"/>
    </marker>
  </defs>
  <g fill="none" stroke="#007a32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="320" y="448" width="400" height="620" stroke-width="1.5"/>
    <rect x="845" y="18" width="135" height="78"/>
    <rect x="845" y="145" width="135" height="54"/>
