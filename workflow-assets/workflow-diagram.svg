  </g>
  <g fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    <text x="912" y="40"><tspan x="912">Traveler enters</tspan><tspan x="912" dy="17">dates, budget,</tspan><tspan x="912" dy="17">destinations and</tspan><tspan x="912" dy="17">interests</tspan></text>
    <text x="912" y="168"><tspan x="912">Generate</tspan><tspan x="912" dy="17">recommendations</tspan></text>
    <text x="567" y="153"><tspan x="567">Load travel data:</tspan><tspan x="567" dy="17">local CSVs or</tspan><tspan x="567" dy="17">production data</tspan><tspan x="567" dy="17">URL</tspan></text>
    <text x="567" y="267"><tspan x="567">Match</tspan><tspan x="567" dy="17">preferences,</tspan><tspan x="567" dy="17">estimate costs and</tspan><tspan x="567" dy="17">rank itineraries</tspan></text>
    <text x="567" y="380"><tspan x="567">Stream progress</tspan><tspan x="567" dy="17">and ranked</tspan><tspan x="567" dy="17">recommendations</tspan></text>
    <text x="487" y="501"><tspan x="487">Recommendation</tspan><tspan x="487" dy="17">map</tspan><tspan x="487" dy="17">Compare and</tspan><tspan x="487" dy="17">select destinations</tspan></text>
    <text x="207" y="613"><tspan x="207">Select another</tspan><tspan x="207" dy="17">recommendation</tspan><tspan x="207" dy="17">or plot type</tspan></text>
    <text x="537" y="714"><tspan x="537">Daily travel price</tspan><tspan x="537" dy="17">comparison</tspan><tspan x="537" dy="17">Stacked bars ·</tspan><tspan x="537" dy="17">Lollipop · Treemap</tspan></text>
    <text x="207" y="869"><tspan x="207">Open a day; edit or</tspan><tspan x="207" dy="17">remove eligible</tspan><tspan x="207" dy="17">prices</tspan></text>
    <text x="442" y="849"><tspan x="442">Category colors</tspan><tspan x="442" dy="17">and legend</tspan><tspan x="442" dy="17">Identify what each</tspan><tspan x="442" dy="17">cost represents</tspan></text>
    <text x="612" y="849"><tspan x="612">Budget summary</tspan><tspan x="612" dy="17">Total cost and %</tspan><tspan x="612" dy="17">of budget</tspan></text>
    <text x="812" y="849"><tspan x="812">Day-detail modal</tspan><tspan x="812" dy="17">Selected day's</tspan><tspan x="812" dy="17">chart and itemized</tspan><tspan x="812" dy="17">costs</tspan></text>
    <text x="812" y="950"><tspan x="812">Dates within</tspan><tspan x="812" dy="17">original trip:</tspan><tspan x="812" dy="17">keep</tspan><tspan x="812" dy="17">recommendations,</tspan><tspan x="812" dy="17">trim days</tspan></text>
    <text x="982" y="950"><tspan x="982">Dates extend</tspan><tspan x="982" dy="17">beyond original</tspan><tspan x="982" dy="17">trip:</tspan><tspan x="982" dy="17">generate new</tspan><tspan x="982" dy="17">recommendations</tspan></text>
    <text x="1030" y="792"><tspan x="1030">Change travel</tspan><tspan x="1030" dy="17">dates</tspan></text>
  </g>
  <text x="330" y="469" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="14">Data visualization — primary user experience</text>
</svg>
