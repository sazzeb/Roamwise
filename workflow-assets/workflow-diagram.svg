    <path d="M912 199 V560 C912 650 895 685 605 727" marker-end="url(#arrow)"/>
    <path d="M567 208 V245" marker-end="url(#arrow)"/>
    <path d="M567 323 V357" marker-end="url(#arrow)"/>
    <path d="M540 422 C515 445 485 448 485 480" marker-end="url(#arrow)"/>
    <path d="M610 422 C705 450 735 545 735 620 C735 685 700 715 605 727" marker-end="url(#arrow)"/>
    <path d="M420 540 C360 575 345 588 275 615" marker-end="url(#arrow)"/>
    <path d="M275 623 C345 655 400 666 470 712" marker-end="url(#arrow)"/>
